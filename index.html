<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDR2 Eventkarte</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#161715;color:#f3ead9}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#22251f;border-bottom:1px solid #4a4d41}h1{font-size:19px;margin:0;margin-right:auto}button,input,textarea,select{font:inherit}button{border:1px solid #83714e;border-radius:7px;background:#433927;color:#fff4d9;padding:9px 12px;cursor:pointer}button:hover{background:#63502f}button:disabled{opacity:.5;cursor:default}.danger{background:#702e2e}#map{height:calc(100dvh - 66px);background:#d7b994}.leaflet-container{background:#d7b994}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#282a23;color:#f6eddd}.leaflet-popup-content{min-width:190px}.leaflet-popup-content h3{margin:0 0 5px}dialog{background:#262820;color:#f3ead9;border:1px solid #8c7856;border-radius:12px;max-width:min(92vw,460px);width:100%;padding:22px}dialog::backdrop{background:#0009}label{display:block;margin:12px 0 5px}input,textarea{display:block;width:100%;border:1px solid #746d58;border-radius:7px;background:#141713;color:#fff;padding:10px}textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.muted{color:#c9bfae;font-size:13px}#status{font-size:13px;color:#ddc99f}#hint{position:absolute;z-index:500;left:12px;bottom:22px;pointer-events:none;background:#1c1d1bdc;padding:8px 12px;border-radius:8px;font-size:13px}#search{max-width:220px}#region{background:#433927;color:#fff4d9;border:1px solid #83714e;border-radius:7px;padding:9px;max-width:290px}.leaflet-marker-icon{filter:drop-shadow(0 2px 2px #0009)}@media(max-width:650px){#map{height:calc(100dvh - 116px)}header{min-height:116px}h1{width:100%}#search{max-width:145px}}
</style></head><body><header><h1>🗺️ RDR2 · Event-Fundorte</h1><input id="search" type="search" placeholder="Fundort suchen …" aria-label="Fundort suchen"><span id="status">Lade …</span><button id="loginBtn">Admin-Login</button><button id="addBtn" hidden>＋ Fundort setzen</button><button id="logoutBtn" hidden>Abmelden</button></header><div id="map"></div><div id="hint">Karte mit Mausrad oder + / − zoomen · Marker anklicken</div>
<dialog id="loginDialog"><form id="loginForm"><h2>Admin anmelden</h2><p class="muted">Nur freigeschaltete Admin-Konten dürfen Fundorte verändern.</p><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Anmelden</button><button type="button" data-close="loginDialog">Abbrechen</button></div><p id="loginError" role="alert"></p></form></dialog>
<dialog id="editDialog"><form id="editForm"><h2 id="editTitle">Fundort hinzufügen</h2><label for="pointTitle">Name</label><input id="pointTitle" maxlength="120" required><label for="pointDesc">Beschreibung (optional)</label><textarea id="pointDesc" maxlength="2000"></textarea>
<label for="pointColor">Markerfarbe</label>
<select id="pointColor">
  <option value="red">🔴 Rot</option>
  <option value="blue">🔵 Blau</option>
  <option value="green">🟢 Grün</option>
  <option value="yellow">🟡 Gelb</option>
  <option value="purple">🟣 Lila</option>
  <option value="orange">🟠 Orange</option>
</select>
<p class="muted">Position: <span id="coords"></span></p><div class="actions"><button type="submit">Speichern</button><button id="deleteBtn" type="button" class="danger" hidden>Löschen</button><button type="button" data-close="editDialog">Abbrechen</button></div><p id="editError" role="alert"></p></form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="./app.js"></script></body></html>
